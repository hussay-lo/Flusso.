<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn | Flusso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="learn.css">
</head>

</html>
<body>
  <header class="flusso-header">
    <a class="flusso-brand" href="./" aria-label="Flusso, home">
      <img
        class="flusso-logo"
        src="image__1_-removebg-preview.png"
        alt="Flusso Logo"
      />
      <span class="flusso-name" aria-hidden="true">LUSSO</span>
    </a>

    <nav class="flusso-nav" aria-label="Main">
      <a href="">Listening</a>
      <a class="flusso-learn" href="">Words & Verbs</a>
      <a class="flusso-meet" href="">Words & Verbs</a>
      <a href="">Grammar</a>
    </nav>
  </header>

  <main class="learn-html">
    <section class="learn-card">
      <p id="italian-word" class="card-word">Tap Learn to start</p>
      <p id="english-word" class="card-translation"></p>
    </section>

    <div class="actions">
      <button id="learn-btn" class="btn btn-primary">Learn</button>
      <button id="save-btn" class="btn btn-outline">Save</button>
    </div>
  </main>
  
</body>
</html>
