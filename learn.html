<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn | Flusso</title>
 
  <!-- Fonts: copy the exact link from your home page if it is different -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
 
  <!-- Shared styles first, then this page's styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="learn.css">
</head>
 
<body class="inner-page">
 
  <header class="flusso-header">
    <a class="flusso-brand" href="learn.html" aria-label="Flusso, home">
      <img class="flusso-logo" src="image__1_-removebg-preview.png" alt="Flusso Logo">
      <span class="flusso-name" aria-hidden="true">LUSSO</span>
    </a>
 
    <nav class="flusso-nav" aria-label="Main">
      <a href="learn.html" aria-current="page">Home</a>
      <a href="#">Listening</a>
      <a href="#">Conversation</a>
      <a href="#">Grammar</a>
    </nav>
  </header>
 
  <main class="learn-html">
 
    <section class="learn-card">
      <p id="italian-word" class="card-word">Tap Learn to start</p>
      <p id="english-word" class="card-translation"></p>
    </section>
 
    <div class="actions">
      <button id="learn-btn" class="btn btn-primary">Learn</button>
      <button id="save-btn" class="btn btn-outline">Save</button>
    </div>
 
    <section class="saved">
      <h2 class="saved-title">Saved words</h2>
      <ul id="saved-list" class="saved-list"></ul>
    </section>
 
  </main>
 
  <script src="learn.js"></script>
</body>
</html>
